# SLA escalation sweep — Phase 1 SLA/notifications increment.
#
# A BACKUP since 2026-09-27: the project is on Vercel Pro, and vercel.json's
# crons run this sweep at :15 and :45 within the minute. This workflow was the
# scheduler while Vercel Hobby rejected sub-daily schedules; GitHub delivers it
# late and sparsely (2-4 runs a day measured), so it only matters if Vercel's
# cron stops. Duplicate runs are harmless: every escalation is claimed once.
#
# The route is a GET handler ON PURPOSE: the OLD system's sla-check cron was
# POST-only while the scheduler sent GET, so it never fired once (BUG-03).
name: SLA escalation sweep
on:
  schedule:
    # Every 30 min, 07:15-18:45 Oman (UTC+4) = 03:15-14:45 UTC.
    - cron: '15,45 3-14 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Curl sla-escalate
        env:
          PROD_CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${PROD_CRON_SECRET}" \
            "https://nmwc-cm.vercel.app/api/cron/sla-escalate"
