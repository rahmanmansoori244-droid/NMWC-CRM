name: DB Backup

# B-01 (audit 2026-05-10), hardened by B3 (enterprise assessment, 2026-09-14).
#
# Off-Neon logical backup. Neon PITR covers 7 days but lives in the same
# provider and region as production, so this pushes an independent copy to
# Cloudflare R2 (`nmwc-backups`, separate credentials and bucket from the photos
# bucket so a leak of one does not expose the other).
#
# What the 2026-09-14 review changed, and why each one mattered:
#   * ENCRYPTION. The object was a plain gzip of plain SQL containing ~20,000
#     customer records with phones, addresses, GPS and CR numbers plus ~106
#     employee password hashes. It is now age-encrypted to the recipients in the
#     `BACKUP_AGE_RECIPIENTS` repository variable before it leaves the runner.
#     KEY LOSS MEANS TOTAL BACKUP LOSS — see docs/OPERATIONS.md §6 "Key escrow".
#   * A MANIFEST. Per-table row counts, the schema object counts and the newest
#     audit timestamp are captured at dump time and uploaded next to the dump,
#     so a restore that silently lost a COPY block is detectable
#     (scripts/ops/backup-manifest.sql, scripts/ops/restore-verify.ts).
#   * INTEGRITY GATES. A dump of an empty or wrong database used to upload green.
#     The job now checks pg_dump's own terminal marker, tests the gzip stream,
#     enforces a byte floor and requires the expected tables to appear.
#   * A DEAD MAN. Every run — success or failure — POSTs to /api/ops/backup-report,
#     so the bearer /api/health probe alarms when a nightly dump is missing or
#     failed (lib/heartbeat.ts, key `db-backup`). Before this, a rotated database
#     password or an expired R2 token broke the backup silently.
#   * NO SAME-DAY OVERWRITE. The key carries the full timestamp, not just the
#     date, so a second run cannot replace the good nightly dump.
#
# Retention: 30 days, enforced bucket-side. That rule is now set and verified
# from code — `npx tsx scripts/ops/r2-backups-lifecycle.ts [--check]` — instead
# of being a dashboard TODO nobody confirmed.
#
# The restore half lives in `.github/workflows/restore-drill.yml`.

on:
  schedule:
    # 02:00 UTC daily = 06:00 Oman, before working hours. GitHub's scheduler is
    # best-effort: observed start hours across 127 runs ranged from 02 to 13,
    # with a worst observed gap of 33 h. The declared RPO accounts for that
    # (docs/OPERATIONS.md §6).
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump → encrypt → R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # Public age recipients (age1…), comma-separated. NOT a secret — public
      # keys are meant to be public. Two recipients = a break-glass second
      # holder; see docs/OPERATIONS.md §6.
      BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
      # DO-16 escape hatch. Must be the exact string "true". It exists so that a
      # deliberate plaintext run is POSSIBLE in an emergency, not so that it is
      # easy: every path that honours it also writes a line into the run summary
      # saying the dump is not encrypted. Unset it again afterwards.
      ALLOW_PLAINTEXT_BACKUP: ${{ vars.ALLOW_PLAINTEXT_BACKUP }}
      # Optional guard: a fragment of the production endpoint host. When set, the
      # job refuses to dump any other database — a DIRECT_URL quietly repointed
      # at UAT used to back up the wrong data, green, forever.
      PROD_DB_HOST_MARKER: ${{ vars.PROD_DB_HOST_MARKER }}
      # Minimum acceptable size of the compressed dump. A real dump of this
      # database is ~megabytes; anything under this is an empty or broken one.
      # Measured: the real production dump is ~327 KB compressed (2026-09-15).
      # The floor exists to catch an EMPTY or wrong database, so it sits well
      # below that rather than just under it — crossing this floor produces no
      # backup at all, which is worse than a small one.
      MIN_DUMP_BYTES: ${{ vars.MIN_DUMP_BYTES || '80000' }}
    steps:
      - name: Checkout (for the manifest query)
        uses: actions/checkout@v4

      - name: Install Postgres 17 client and age
        run: |
          set -euo pipefail
          # Match Neon's server major (17 as of 2026-05). Ubuntu's default ships
          # an older pg, which refuses to pg_dump a newer server with
          # `aborting because of server version mismatch`. Bump if Neon upgrades.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # age used to be optional: if the universe mirror was having a bad day we
          # still took the backup and called it unencrypted. That was the right call
          # when encryption did not exist and the alternative was NO backup. It is the
          # wrong call now that plaintext IS the hazard — this dump is the whole
          # customer master and every password hash. So: retry once for a mirror
          # flake, then fail HERE rather than at Encrypt, so an infrastructure fault
          # is never mistaken for the operator's missing key.
          if ! sudo apt-get install -y --no-install-recommends age; then
            sleep 15
            if ! sudo apt-get install -y --no-install-recommends age; then
              if [ "${ALLOW_PLAINTEXT_BACKUP:-}" = "true" ]; then
                echo "::warning::age could not be installed and ALLOW_PLAINTEXT_BACKUP=true — this run will upload UNENCRYPTED"
              else
                echo "::error::age could not be installed from the Ubuntu universe mirror, after a retry. This is an infrastructure fault, NOT a missing key. Re-run the job."
                exit 1
              fi
            fi
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          age --version || true

      - name: Compute backup metadata
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          # Full timestamp in the key: a same-day re-run adds an object instead
          # of replacing the good nightly dump.
          echo "BASE_KEY=db/${STAMP}" >> "$GITHUB_ENV"
          echo "STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      # Fail in seconds, not after pg_dump. The encrypt step refuses without the
      # recipients, and discovering that AFTER spending several minutes dumping the
      # whole database wastes the run and reads like a dump failure rather than a
      # missing key. Checked here so the message names the actual cause first.
      - name: Refuse early if the dump could not be encrypted
        run: |
          set -euo pipefail
          if [ -n "${BACKUP_AGE_RECIPIENTS:-}" ]; then
            echo "age recipients are configured; the dump will be encrypted."
            exit 0
          fi
          if [ "${ALLOW_PLAINTEXT_BACKUP:-}" = "true" ]; then
            echo "::warning::BACKUP_AGE_RECIPIENTS is not set and ALLOW_PLAINTEXT_BACKUP=true — this run will produce an UNENCRYPTED dump, and the job will be marked FAILED at the end so this cannot be left switched on unnoticed."
            exit 0
          fi
          echo "::error::BACKUP_AGE_RECIPIENTS is not set, so this dump could not be encrypted and will not be taken. NOTE: THERE IS NO BACKUP TONIGHT. Set the repository VARIABLE to an age public key — run 'npm run ops:print-secrets', or see docs/OPERATIONS.md 6.7 and step 10 of the go-live runbook. Until 2026-09-15 this job uploaded a PLAINTEXT copy of the whole customer master and every password hash instead, which is why it now refuses."
          exit 1

      - name: Validate the connection string
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set"; exit 1
          fi
          # Secrets pasted through the GitHub UI often carry a trailing CR/LF,
          # which makes pg_dump fall back to a local Unix socket and fail with a
          # confusing socket error. Strip whitespace first.
          CLEAN="$(printf '%s' "$DIRECT_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]\+//' -e 's/[[:space:]]\+$//')"
          case "$CLEAN" in
            postgresql://*|postgres://*) ;;
            "") echo "::error::DIRECT_URL is empty after trim"; exit 1;;
            *)  echo "::error::DIRECT_URL must start with postgresql:// — re-paste the value without the 'DIRECT_URL=' prefix and without quotes"; exit 1;;
          esac
          # Diagnose without leaking anything: length only. The previous version
          # echoed the first 13 and last 25 characters into the public run log.
          echo "::notice::DIRECT_URL parsed, length=${#CLEAN}"
          if [ -n "${PROD_DB_HOST_MARKER:-}" ]; then
            case "$CLEAN" in
              *"${PROD_DB_HOST_MARKER}"*) echo "::notice::host matches PROD_DB_HOST_MARKER";;
              *) echo "::error::DIRECT_URL does not point at the expected production host (PROD_DB_HOST_MARKER). Refusing to back up the wrong database."; exit 1;;
            esac
          else
            echo "::warning::PROD_DB_HOST_MARKER repository variable is not set — this job cannot tell which database it is dumping."
          fi
          echo "PGURL=${CLEAN}" >> "$GITHUB_ENV"

      - name: Row-count manifest (before the dump)
        run: |
          set -euo pipefail
          # Absolute path, as the old workflow did: Ubuntu pre-installs a v16
          # client and it wins on PATH, and v16 refuses to talk to a v17 server.
          /usr/lib/postgresql/17/bin/psql "$PGURL" -At -f scripts/ops/backup-manifest.sql > "${STAMP}.manifest.json" \
            || { echo "::warning::manifest query failed — continuing without row counts; the restore verifier will fall back to its schema checks"; rm -f "${STAMP}.manifest.json"; }
          if [ -s "${STAMP}.manifest.json" ]; then
            jq -r '"source: \(.tableCount) tables, \(.triggerCount) triggers, newest audit \(.newestAuditAt // "none")"' "${STAMP}.manifest.json"
            # An UNLOGGED table would have its DATA silently omitted by the dump.
            UNLOGGED=$(jq '.unloggedTables | length' "${STAMP}.manifest.json")
            if [ "$UNLOGGED" != "0" ]; then
              echo "::error::the database has UNLOGGED tables — --no-unlogged-table-data would back them up with NO ROWS"; exit 1
            fi
          fi

      - name: pg_dump → gzip
        run: |
          set -euo pipefail
          # --no-owner / --no-privileges: portable across roles. NOTE: this also
          # means the restore has NO roles and NO grants — the nmwc_app runtime
          # role must be re-created after every restore (scripts/ops/app-role.ts).
          # --format=plain: SQL text, inspectable and partially restorable.
          # --no-unlogged-table-data: guarded above.
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges --format=plain --no-unlogged-table-data \
            "$PGURL" | gzip --best > "${STAMP}.sql.gz"
          ls -lh "${STAMP}.sql.gz"

      - name: Verify the dump, and count what it contains
        run: |
          set -euo pipefail
          # ONE decompression pass, and nothing in it exits early.
          #
          # The previous version ran `gunzip -c f | grep -q PATTERN` per table.
          # Under pipefail that fails on a GOOD dump: grep -q exits on the first
          # match, gunzip dies of SIGPIPE (141), and the job aborted before the
          # upload — every night, on a perfectly valid backup. awk consumes the
          # whole stream, so the writer always finishes; it also emits the row
          # counts, which is what the restore must reproduce (scripts/ops/dump-rowcounts.awk).
          gzip -t "${STAMP}.sql.gz"
          gunzip -c "${STAMP}.sql.gz" | awk -f scripts/ops/dump-rowcounts.awk > dump-rowcounts.tsv
          echo "tables in dump: $(wc -l < dump-rowcounts.tsv)"
          # The tables that matter must be present AND their COPY block parsed.
          # Exact, locale-independent membership test. `grep -P` is not portable
          # (it refuses to run in some locales) and piping into `grep -q` would
          # reintroduce the SIGPIPE problem; `tr` consumes all of its input and
          # `case` is a shell builtin.
          FOUND=" $(cut -f1 dump-rowcounts.tsv | tr '\n' ' ')"
          for T in Customer Branch User AuditLog; do
            case "$FOUND" in
              *" $T "*) ;;
              *) echo "::error::dump contains no data section for table $T"; exit 1;;
            esac
          done
          # Not an empty database.
          BYTES=$(stat -c%s "${STAMP}.sql.gz")
          echo "compressed size: ${BYTES} bytes (floor ${MIN_DUMP_BYTES})"
          if [ "$BYTES" -lt "$MIN_DUMP_BYTES" ]; then
            echo "::error::dump is only ${BYTES} bytes — an empty or wrong database would look like this"; exit 1
          fi
          echo "BYTES=${BYTES}" >> "$GITHUB_ENV"

      - name: Merge the dump's row counts into the manifest
        run: |
          set -euo pipefail
          if [ ! -s "${STAMP}.manifest.json" ]; then
            echo "::warning::no manifest to merge into — skipping"; exit 0
          fi
          # The manifest's schema counts and RPO watermark come from psql before
          # the dump; its ROW COUNTS now come from the dump itself, so a write
          # during the dump window cannot make a perfect restore look wrong.
          jq --rawfile counts dump-rowcounts.tsv '
            .rowCounts = (
              $counts | split("\n") | map(select(length > 0) | split("\t"))
              | map({key: .[0], value: (.[1] | tonumber)}) | from_entries
            )
            | .rowCountsSource = "dump"
          ' "${STAMP}.manifest.json" > manifest.merged.json
          mv manifest.merged.json "${STAMP}.manifest.json"
          jq -r '"manifest: \(.rowCounts | length) tables, \(.rowCounts | to_entries | map(.value) | add) rows"' "${STAMP}.manifest.json"

      - name: Encrypt (age)
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null 2>&1; then
            if [ "${ALLOW_PLAINTEXT_BACKUP:-}" = "true" ]; then
              echo "::warning::age is not installed and ALLOW_PLAINTEXT_BACKUP=true — uploading an UNENCRYPTED dump"
              echo "ALLOW_PLAINTEXT_BACKUP=true was honoured: this dump is NOT encrypted." >> "$GITHUB_STEP_SUMMARY"
              echo "DUMP_FILE=${STAMP}.sql.gz" >> "$GITHUB_ENV"
              echo "DUMP_KEY=${BASE_KEY}.sql.gz" >> "$GITHUB_ENV"
              echo "ENCRYPTED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::age is not installed and no override is set — refusing to upload a plaintext dump."
            exit 1
          fi
          if [ -z "${BACKUP_AGE_RECIPIENTS:-}" ]; then
            if [ "${ALLOW_PLAINTEXT_BACKUP:-}" = "true" ]; then
              echo "::warning::BACKUP_AGE_RECIPIENTS is not set and ALLOW_PLAINTEXT_BACKUP=true — uploading an UNENCRYPTED dump of the whole customer master and every password hash"
              echo "ALLOW_PLAINTEXT_BACKUP=true was honoured: this dump is NOT encrypted." >> "$GITHUB_STEP_SUMMARY"
              echo "DUMP_FILE=${STAMP}.sql.gz" >> "$GITHUB_ENV"
              echo "DUMP_KEY=${BASE_KEY}.sql.gz" >> "$GITHUB_ENV"
              echo "ENCRYPTED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            # DO-16: this used to warn and upload anyway, inside a run that stayed
            # green — and the checklist the owner is told to follow did not name this
            # variable, so the likely outcome was a nightly plaintext copy of every
            # customer and every password hash that nobody noticed.
            echo "::error::BACKUP_AGE_RECIPIENTS is not set — refusing to upload a plaintext dump of the whole customer master and every password hash. Run 'npm run ops:print-secrets', or see docs/OPERATIONS.md 6.7."
            exit 1
          fi
          ARGS=()
          IFS=',' read -ra RECIPIENTS <<< "$BACKUP_AGE_RECIPIENTS"
          for R in "${RECIPIENTS[@]}"; do
            R="$(echo "$R" | xargs)"
            [ -n "$R" ] && ARGS+=(-r "$R")
          done
          echo "encrypting to ${#ARGS[@]} recipient key(s) / 2"
          age "${ARGS[@]}" -o "${STAMP}.sql.gz.age" "${STAMP}.sql.gz"
          rm -f "${STAMP}.sql.gz"
          ls -lh "${STAMP}.sql.gz.age"
          echo "DUMP_FILE=${STAMP}.sql.gz.age" >> "$GITHUB_ENV"
          echo "DUMP_KEY=${BASE_KEY}.sql.gz.age" >> "$GITHUB_ENV"
          echo "ENCRYPTED=true" >> "$GITHUB_ENV"

      - name: Upload to R2 (nmwc-backups)
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_R2_ACCOUNT_ID:-}" ] || [ -z "${BACKUP_R2_BUCKET:-}" ]; then
            echo "::error::BACKUP_R2_ACCOUNT_ID / BACKUP_R2_BUCKET secrets missing"; exit 1
          fi
          ENDPOINT="https://${BACKUP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${DUMP_FILE}" "s3://${BACKUP_R2_BUCKET}/${DUMP_KEY}" \
            --endpoint-url "$ENDPOINT" --checksum-algorithm CRC32
          # The manifest is not encrypted: it holds counts and timestamps, no
          # personal data, and a recovery needs it to be readable.
          if [ -s "${STAMP}.manifest.json" ]; then
            aws s3 cp "${STAMP}.manifest.json" "s3://${BACKUP_R2_BUCKET}/${BASE_KEY}.manifest.json" \
              --endpoint-url "$ENDPOINT" --checksum-algorithm CRC32
          fi
          # Prove the object is really in the bucket we think it is.
          aws s3api head-object --bucket "$BACKUP_R2_BUCKET" --key "${DUMP_KEY}" \
            --endpoint-url "$ENDPOINT" > /dev/null
          echo "::notice::uploaded ${DUMP_KEY} (${BYTES} bytes, encrypted=${ENCRYPTED})"

      - name: Report the outcome to the app (dead man)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://nmwc-cm.vercel.app' }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::PROD_CRON_SECRET is not set — the backup dead-man alarm cannot be fed, so /api/health will report the backup as 'never'."
            exit 0
          fi
          OK='true'; ERR=''
          if [ "${{ job.status }}" != "success" ]; then
            OK='false'; ERR='backup job status: ${{ job.status }} — open the workflow run'
          fi
          DURATION=$(( ( $(date -u +%s) - ${STARTED_AT:-$(date -u +%s)} ) * 1000 ))
          # jq, not a heredoc: an indented heredoc inside a YAML block scalar
          # either breaks the YAML or breaks Python's indentation rules.
          BODY=$(jq -n \
            --argjson ok "$OK" \
            --arg err "$ERR" \
            --argjson duration "$DURATION" \
            --argjson bytes "${BYTES:-0}" \
            --arg key "${DUMP_KEY:-}" \
            --argjson encrypted "${ENCRYPTED:-false}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{ok: $ok, durationMs: $duration, bytes: $bytes, objectKey: $key, encrypted: $encrypted, runUrl: $runUrl, error: $err}')
          CODE=$(curl -s -o /tmp/report.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            --max-time 30 \
            "${APP_BASE_URL}/api/ops/backup-report" || echo 000)
          echo "backup-report → HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::warning::the backup dead-man was not recorded (HTTP ${CODE}); /api/health will show the backup as stale"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### DB backup ${DATE:-?}"
            echo "- object: \`${DUMP_KEY:-not uploaded}\`"
            echo "- manifest: \`${BASE_KEY:-?}.manifest.json\`"
            echo "- size: ${BYTES:-?} bytes"
            echo "- encrypted: ${ENCRYPTED:-unknown}"
            echo "- job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The escape hatch must not be survivable. OPERATIONS.md tells the operator
      # to set ALLOW_PLAINTEXT_BACKUP, take the run and unset it — and the whole
      # DO-16 finding was that a plaintext dump inside a GREEN run is exactly what
      # nobody notices. So a plaintext run uploads (the emergency works, and the
      # dead-man report above has already been sent, recording encrypted:false)
      # and then goes RED, every night, until the variable is removed.
      - name: An unencrypted dump must not leave a green run behind
        if: always()
        run: |
          set -uo pipefail
          if [ "${ENCRYPTED:-true}" = "false" ]; then
            echo "::error::This run uploaded an UNENCRYPTED dump of the whole customer master and every password hash, because ALLOW_PLAINTEXT_BACKUP is set. The object is in the bucket and the dead-man has been fed, so the backup itself succeeded — this failure exists so the switch cannot be left on quietly. Remove the ALLOW_PLAINTEXT_BACKUP repository variable, set BACKUP_AGE_RECIPIENTS, and delete the plaintext object: ${DUMP_KEY:-see the Upload step}."
            exit 1
          fi
