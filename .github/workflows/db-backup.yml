name: DB Backup

# B-01 (audit 2026-05-10): off-Neon logical backup. Neon PITR covers 7 days
# but is in the same provider/region as production. This workflow takes a
# `pg_dump --format=plain --no-owner --no-privileges` from the direct URL,
# gzips it, and pushes it to Cloudflare R2 bucket `nmwc-backups` (separate
# credentials and bucket from the photos bucket so a leak of one doesn't
# expose the other).
#
# Retention: 30 days, enforced bucket-side via R2 lifecycle rule on
# `nmwc-backups` (object age > 30 days → expire). See docs/OPERATIONS.md
# §"R2 backup & versioning". TODO operator: confirm lifecycle rule is set
# in the Cloudflare R2 dashboard for `nmwc-backups`.
#
# Failure mode: any non-zero exit from pg_dump or aws s3 cp fails the run
# loud and red so the operator notices a missed backup the same day.

on:
  schedule:
    # 02:00 UTC daily = 06:00 Oman, before working hours.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump → R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Install Postgres 16 client
        run: |
          set -euo pipefail
          # Match Neon's server major (16). Ubuntu 22.04 ships pg 14, which
          # cannot pg_dump from a 16 server (refuses with version mismatch).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Compute backup metadata
        id: meta
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "OBJECT_KEY=db/${DATE}.sql.gz" >> "$GITHUB_ENV"
          echo "date=${DATE}"  >> "$GITHUB_OUTPUT"

      - name: pg_dump → gzip
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set"
            exit 1
          fi
          # --no-owner / --no-privileges: portable across roles
          # --format=plain: SQL text, easy to inspect and partial-restore
          # --no-unlogged-table-data: skip ephemeral / cache-style tables
          # `set -o pipefail` (above) makes the gzip pipeline fail if pg_dump
          # itself returns non-zero; that propagates to step exit 1.
          pg_dump \
            --no-owner \
            --no-privileges \
            --format=plain \
            --no-unlogged-table-data \
            "$DIRECT_URL" \
            | gzip --best > "${STAMP}.sql.gz"
          ls -lh "${STAMP}.sql.gz"

      - name: Upload to R2 (nmwc-backups)
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_R2_ACCOUNT_ID:-}" ] || [ -z "${BACKUP_R2_BUCKET:-}" ]; then
            echo "::error::BACKUP_R2_ACCOUNT_ID / BACKUP_R2_BUCKET secrets missing"
            exit 1
          fi
          aws s3 cp \
            "${STAMP}.sql.gz" \
            "s3://${BACKUP_R2_BUCKET}/${OBJECT_KEY}" \
            --endpoint-url "https://${BACKUP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --checksum-algorithm CRC32

      - name: Summary
        if: always()
        run: |
          echo "### DB backup ${DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- key: \`${OBJECT_KEY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- bucket: \`${BACKUP_R2_BUCKET}\`" >> "$GITHUB_STEP_SUMMARY"

  # B-01 follow-up: monthly restore drill. workflow_dispatch only — operator
  # runs this on demand to prove backups are restorable. It pulls the most
  # recent dump from R2 and pipes it into a Neon branch named
  # `restore-drill-<DATE>` via the Neon REST API. The branch must be deleted
  # by hand after verification (cheap, but not free).
  #
  # TODO operator (one-time): set GitHub secret `NEON_API_KEY` (Neon console
  # → Settings → API keys) and `NEON_PROJECT_ID` (snowy-haze-29025382 from
  # OPERATIONS.md). Without them this job fails at the "create branch" step.
  restore-drill:
    name: Restore drill (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Install Postgres 16 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Find latest dump in R2
        run: |
          set -euo pipefail
          LATEST_KEY=$(
            aws s3api list-objects-v2 \
              --bucket "${BACKUP_R2_BUCKET}" \
              --prefix "db/" \
              --endpoint-url "https://${BACKUP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --query 'reverse(sort_by(Contents,&LastModified))[0].Key' \
              --output text
          )
          if [ -z "$LATEST_KEY" ] || [ "$LATEST_KEY" = "None" ]; then
            echo "::error::No dumps found under db/ prefix"
            exit 1
          fi
          echo "LATEST_KEY=${LATEST_KEY}" >> "$GITHUB_ENV"
          echo "DRILL_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Download latest dump
        run: |
          set -euo pipefail
          aws s3 cp \
            "s3://${BACKUP_R2_BUCKET}/${LATEST_KEY}" \
            ./latest.sql.gz \
            --endpoint-url "https://${BACKUP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ls -lh ./latest.sql.gz

      - name: Create Neon branch restore-drill-${{ env.DRILL_DATE }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::error::NEON_API_KEY / NEON_PROJECT_ID secrets missing"
            exit 1
          fi
          BRANCH_NAME="restore-drill-${DRILL_DATE}"
          RESP=$(curl -fsSL -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d "{\"branch\":{\"name\":\"${BRANCH_NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
          # Endpoint host + role/password are returned in the create response.
          DRILL_HOST=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["endpoints"][0]["host"])')
          DRILL_ROLE=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["roles"][0]["name"])')
          DRILL_PASS=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["roles"][0]["password"])')
          DB_NAME=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["databases"][0]["name"])')
          echo "::add-mask::${DRILL_PASS}"
          DRILL_URL="postgresql://${DRILL_ROLE}:${DRILL_PASS}@${DRILL_HOST}/${DB_NAME}?sslmode=require"
          echo "DRILL_URL=${DRILL_URL}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

      - name: Restore dump into drill branch
        run: |
          set -euo pipefail
          gunzip -c ./latest.sql.gz | psql "${DRILL_URL}" -v ON_ERROR_STOP=1 -q
          # Smoke test: count tables in public schema. A successful restore
          # should leave at least the core CRM tables present.
          COUNT=$(psql "${DRILL_URL}" -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "Restored to branch ${BRANCH_NAME}; public tables: ${COUNT}"
          if [ "${COUNT:-0}" -lt 10 ]; then
            echo "::error::Restore drill suspicious — fewer than 10 public tables"
            exit 1
          fi

      - name: Drill summary
        if: always()
        run: |
          echo "### Restore drill" >> "$GITHUB_STEP_SUMMARY"
          echo "- source dump: \`${LATEST_KEY:-?}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- target branch: \`${BRANCH_NAME:-?}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- DELETE the branch in Neon console after verifying." >> "$GITHUB_STEP_SUMMARY"
